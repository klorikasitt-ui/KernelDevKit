name: KernelDevKit CI

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install textual flake8

    - name: Lint with flake8
      run: |
        # Python yazım hatalarını ve tanımsız isimleri kontrol eder
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Test Installation Script
      run: |
        # Makefile'ın hata verip vermediğini kontrol eder
        # sudo olmadan yerel bir bin klasörüne kurulum simülasyonu
        mkdir -p ./test_bin
        sed -i 's|/usr/local/bin|./test_bin|g' Makefile
        make install
        
